[project]
name = "creditflow-peru"
version = "0.1.0"
description = "Credit scoring sobre datos de Lending Club (proyecto de portafolio de Data Engineering)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[tool.poetry]
packages = [{ include = "creditflow", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
ruff = ">=0.8"
pre-commit = ">=4"
jupyterlab = ">=4"
ipykernel = ">=6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
